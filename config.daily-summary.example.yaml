# dd-clip-miner-llm daily summary config
# Usage:
#   python -m dd_clip_miner_llm run live.mp4 --config config.daily-summary.example.yaml

audio:
  sample_rate: 16000
  channels: 1

asr:
  mode: local
  local:
    backend: qwen3_asr
    funasr:
      model: Qwen/Qwen3-ASR-1.7B
      hub: hf
      device: cuda:0
      dtype: bf16
      batch_size: null
      language: null
      timestamp_chunk_seconds: 180
      max_workers: 2
      forced_aligner: Qwen/Qwen3-ForcedAligner-0.6B
      forced_aligner_kwargs: {}
      generate_kwargs:
        return_time_stamps: true
      keep_chunk_audio: false
      fallback:
        enabled: true
        chunk_seconds: 5
        max_segment_seconds: 15
        sparse_chars_per_sec: 1.0
        repeat_threshold: 3
        padding_seconds: 2.0
        max_workers: 2
        merge_policy: replace_ranges
        zero_duration_policy: merge_adjacent
    # CPU/轻量备选：将 backend 改为 faster_whisper 并启用下方配置
    faster_whisper:
      device: auto
      compute_type: default
      batch:
        model: turbo
        inference_mode: batched
        batch_size: 8
        vad_filter: true
      standard:
        model: turbo
        inference_mode: standard
        vad_filter: false
      fallback:
        enabled: true
        primary_mode: batch
        fallback_mode: standard
        merge_policy: replace_ranges

  remote:
    provider: mimo
    base_url: https://token-plan-cn.xiaomimimo.com/v1
    api_key: null
    api_key_env: MIMO_API_KEY
    model: mimo-v2.5-asr
    timestamp_chunk_seconds: 5
    language: null

llm:
  provider_route:
  - opencode
  - deepseek
  - mimo
  providers:
    opencode:
      api_key: null
      api_key_env: OPENCODE_API_KEY
      base_url: https://opencode.ai/zen/go/v1
      model: deepseek-v4-flash
      temperature: 0.1
      max_tokens: 8192
      timeout_schedule: [60, 120, 180]
      retry_backoff_seconds: [2, 5]
      retry_jitter_ratio: 0.25
      result_retries: 2
    deepseek:
      api_key: null
      api_key_env: DEEPSEEK_API_KEY
      base_url: https://api.deepseek.com
      model: deepseek-v4-flash
      temperature: 0.1
      max_tokens: 8192
      timeout_schedule: [60, 120, 180]
      retry_backoff_seconds: [2, 5]
      retry_jitter_ratio: 0.25
      result_retries: 2
    mimo:
      api_key: null
      api_key_env: MIMO_API_KEY
      base_url: https://token-plan-cn.xiaomimimo.com/v1
      model: mimo-v2.5-pro
      temperature: 0.1
      max_tokens: 8192
      timeout_schedule: [60, 120, 180]
      retry_backoff_seconds: [2, 5]
      retry_jitter_ratio: 0.25
      result_retries: 2
  retry_empty_with_reasoning: true
  reasoning_followup_rounds: 5
  reasoning_followup_max_tokens: 32768
  batch_size: null
  cache_friendly_prompt_layout: false
  use_tools: false
  verify_with_search: false
  json_fix_rounds: 3

content_types:
  daily_summary: true

daily_summary:
  enabled: true
  summary_only: true
  language: zh-CN
  title: 当天直播内容总结
  max_level1_items: 6
  max_level2_per_level1: 5
  max_level3_per_level2: 4
  include_timeline: true
  include_quotes: true
  include_open_questions: true

output:
  video_clips: false
  audio_segments: false
  audio_extension: mp3
  audio_bitrate_kbps: 320
  video_extension: mp4
  video_codec: copy
  match_context_segments: 10
  concat_videos: false