# =============================================================================
# cut_copy 录播自动处理工作流配置模板（双文件布局的工作流部分）
# =============================================================================
# 与 config/example/cut_copy_stub.yaml 配对使用（迁移自旧版单文件 config 后的常见布局）。
#
# 读取方:
#   python -m dd_clip_miner_llm cut-copy --conf config/local/cut_copy.conf
#   python -m dd_clip_miner_llm cut-copy-task --conf config/local/cut_copy.conf  # 计划任务
#   batch-run --cut-copy-conf config/local/cut_copy.conf
#
# 首次部署:
#   copy config/example/cut_copy.conf config/local/cut_copy.conf
#   copy config/example/cut_copy_stub.yaml config/local/cut_copy.yaml
#
# 单文件布局见 config/example/cut_copy.yaml（完整工作流写在一个 YAML 里）。
# =============================================================================

enabled: true

source:
  path: "//ddtv-machine/Recordings"           # SMB 共享；会递归扫描日期子目录（如 2026_06_25/）
  pattern: "*_fix.mp4"
  done_marker: ".dd_clip_miner_cut_copy_done.json"

destination:
  path: "//nas/dd-clip-results"
  username: ""
  password: ""
  folder_format: "{streamer}"

processing:
  config_path: "config/local/main.yaml"       # 主配置（concat 等在 output.yaml）
  skip_on_failure: true

behavior:
  shutdown_after: false
  shutdown_delay: 60
  delete_source_after_copy: false
  delete_work_dir: false
  log_file: "cut_copy.log"
  max_files: 0
  max_runtime: 0