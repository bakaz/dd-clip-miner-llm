# =============================================================================
# cut_copy 录播自动处理工作流配置模板 (standalone)
# =============================================================================
# 读取方: python -m dd_clip_miner_llm cut-copy --conf config/local/cut_copy.yaml
#         或 batch-run 加 --cut-copy-conf（省略路径时从 main.yaml 的 cut_copy.conf_path 读取）
#         或 batch-run 结束后由 main.yaml 的 cut_copy.enabled 自动触发
# 迁移用户: cut_copy.yaml 可能仅为域桩（enabled/conf_path），实际工作流在 cut_copy.conf
#
# 首次使用:
#   copy config/example/cut_copy.yaml config/local/cut_copy.yaml
# 先 dry-run 验证扫描范围:
#   python -m dd_clip_miner_llm cut-copy --conf config/local/cut_copy.yaml --dry-run
# 正式运行:
#   python -m dd_clip_miner_llm cut-copy --conf config/local/cut_copy.yaml
#
# 整体流程:
#   ① 扫描 source.path 下匹配 pattern 的新录播（跳过含 done_marker 的目录）
#   ② 对每个文件调用 dd-clip-miner-llm run（使用 processing.config_path）
#   ③ 将 runs/ 结果复制到 destination.path / folder_format / run目录名
#   ④ 校验复制完整性 → 按 behavior 删源/删工作目录 → 可选关机
#
# 典型拓扑: DDTV 机录播 → SMB → GPU 机 batch-run → NAS 归档 → GPU 关机
# =============================================================================

# 是否启用 cut-copy。main.yaml 的 cut_copy.enabled 仍控制 batch-run 是否自动触发本流程。
enabled: true                               # false=本文件存在但不执行 cut-copy 逻辑

# ─── source：DDTV 录播源目录 ─────────────────────────────────
source:
  path: "//ddtv-machine/Recordings"           # SMB 共享或映射盘符，如 "R:/Recordings"
  pattern: "*_fix.mp4"                        # 递归匹配子目录（如 2026_06_25/*.mp4）；DDTV 修复后为 _fix.mp4
  done_marker: ".dd_clip_miner_cut_copy_done.json"  # 处理完成后写入此文件，下次跳过

# ─── destination：处理结果归档目标 ───────────────────────────
destination:
  path: "//nas/dd-clip-results"               # 目标 SMB/NAS 根路径
  username: ""                                # SMB 用户名；已映射网络驱动器可留空
  password: ""                                # SMB 密码；Windows 已保存凭据可留空
  folder_format: "{streamer}"                 # 子目录名；{streamer}=从路径解析；也可用 "{date}_{streamer}"

# ─── processing：调用主程序时的参数 ──────────────────────────
processing:
  config_path: "config/local/main.yaml"       # 主配置路径（profile、content_types、ASR 等）
  skip_on_failure: true                       # true=单文件失败继续下一个 | false=中止整批

# ─── behavior：批处理完成后的清理与关机 ──────────────────────
behavior:
  shutdown_after: false                       # true=全部完成后关机 GPU 机
  shutdown_delay: 60                          # 关机倒计时 (秒)，可用 shutdown /a 取消
  delete_source_after_copy: false             # true=校验通过后删除 source 侧原录播
  delete_work_dir: false                      # true=删除本地 runs/ 工作目录（归档后释放磁盘）
  log_file: "cut_copy.log"                    # 日志文件名（写在当前工作目录）
  max_files: 0                                # 单次最多处理文件数；0=不限
  max_runtime: 0                              # 单次最长运行 (秒)；0=不限，超时则做完当前文件后停
