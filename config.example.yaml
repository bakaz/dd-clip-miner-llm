audio:
  sample_rate: 16000
  channels: 1
asr:
  mode: local
  local:
    backend: faster_whisper
    faster_whisper:
      device: auto
      compute_type: default
      cpu_threads: 8
      num_workers: 1
      language: null
      beam_size: 5
      initial_prompt: null
      word_timestamps: true
      split_on_word_gaps: true
      word_gap_seconds: 2.0
      max_segment_seconds: 15.0
      batch:
        model: turbo
        inference_mode: batched
        batch_size: 8
        vad_filter: true
      standard:
        model: turbo
        inference_mode: standard
        batch_size: 0
        vad_filter: false
      fallback:
        enabled: true
        primary_mode: batch
        fallback_mode: standard
        min_gap_seconds: 4.0
        padding_seconds: 2.0
        max_workers: 1
        merge_policy: fill_gaps
    funasr:
      model: iic/SenseVoiceSmall
      hub: ms
      trust_remote_code: true
      device: auto
      batch_size: 1
      timestamp_chunk_seconds: 5
      max_workers: 4
      language: null
      vad_model: null
      punc_model: null
      spk_model: null
      generate_kwargs: {}
  remote:
    provider: mimo
    base_url: https://token-plan-cn.xiaomimimo.com/v1
    api_key: null
    api_key_env: MIMO_API_KEY
    model: mimo-v2.5-asr
    timestamp_chunk_seconds: 5
    language: null
llm:
  provider_route:
  - opencode
  - deepseek
  - mimo
  providers:
    opencode:
      api_key: null
      api_key_env: OPENCODE_API_KEY
      base_url: https://opencode.ai/zen/go/v1
      model: deepseek-v4-flash
      temperature: 0.1
      max_tokens: 8192
      timeout_schedule:
      - 60
      - 120
      - 180
      retry_backoff_seconds:
      - 2
      - 5
      retry_jitter_ratio: 0.25
      result_retries: 2
    deepseek:
      api_key: null
      api_key_env: DEEPSEEK_API_KEY
      base_url: https://api.deepseek.com
      model: deepseek-v4-flash
      thinking: disabled
      temperature: 0.1
      max_tokens: 8192
      timeout_schedule:
      - 60
      - 120
      - 180
      retry_backoff_seconds:
      - 2
      - 5
      retry_jitter_ratio: 0.25
      result_retries: 2
    mimo:
      api_key: null
      api_key_env: MIMO_API_KEY
      base_url: https://token-plan-cn.xiaomimimo.com/v1
      model: mimo-v2.5-pro
      temperature: 0.1
      max_tokens: 8192
      timeout_schedule:
      - 60
      - 120
      - 180
      retry_backoff_seconds:
      - 2
      - 5
      retry_jitter_ratio: 0.25
      result_retries: 2
  retry_empty_with_reasoning: true
  reasoning_followup_rounds: 5
  reasoning_followup_max_tokens: 32768
  max_completion_tokens: 32768
  batch_size: null
  max_tool_rounds: 2
  final_tool_max_tokens: 32768
  continuation_on_length: true
  max_continuation_rounds: 8
  debug_store_requests: false
  reuse_valid_batches: true
  use_tools: true
  verify_with_search: true
  json_fix_rounds: 3
default_profile: kv_optimized
profiles:
  accuracy:
    llm:
      cache_friendly_prompt_layout: false
      compact_segment_ranges: false
    song:
      pipeline:
        strategy: legacy
        runtime_adaptive: disabled
        temporal_adjudication:
          enabled: false
      review:
        enabled: true
        transcript_scope: local
      missed_recheck:
        enabled: true
        strategy: windowed
        output_mode: matches
  kv_v2:
    llm:
      cache_friendly_prompt_layout: true
      compact_segment_ranges: true
    song:
      pipeline:
        strategy: legacy
        runtime_adaptive: disabled
        temporal_adjudication:
          enabled: false
      review:
        enabled: true
        transcript_scope: full
        merge_policy: llm_guided
      missed_recheck:
        enabled: true
        strategy: full_transcript
        output_mode: matches
        fallback_strategy: windowed_on_structural_failure
      kv_v2:
        min_cluster_size_for_review: 2
        deletion_confidence_threshold: 0.75
        unknown_deletion_confidence_threshold: 0.6
  kv_optimized:
    llm:
      cache_friendly_prompt_layout: true
      compact_segment_ranges: true
    song:
      normalization:
        force_merge_same_title: true
        chorus_aware_split: true
        chorus_gap_seconds: 130.0
        chorus_similarity_threshold: 0.3
        chorus_context_segments: 3
      pipeline:
        strategy: risk_routed_kv
        runtime_adaptive: fixed_three_stage
        temporal_adjudication:
          enabled: true
          preserve_source_names: true
          max_completion_tokens: 8192
        stages:
          discovery: precision
          recall_audit: uncovered_evidence
          adjudication: full_transcript
        continuation_overlap_segments: 50
        allow_final_discovery: true
        anchor_boundary_expansion: false
      naming:
        search_query_source: lyric_anchors
        preserve_unknown_on_weak_evidence: true
      search:
        enabled: false
        search_unknown_only: true
        max_searches: 25
      missed_recheck:
        enabled: true
        output_mode: anchors
        min_uncovered_seconds: 10.0
        check_all_uncovered: true
        max_tool_rounds: 0
      review:
        enabled: false
padding:
  before_seconds: 15.0
  after_seconds: 15.0
  after_next_asr_end_guard_seconds: 2.0
  adaptive_silence_padding: true
  adaptive_silence_gap_threshold_seconds: 25.0
  adaptive_silence_gap_ratio: 0.95
  adaptive_max_before_seconds: 45.0
  adaptive_max_after_seconds: 45.0
  min_song_seconds: 75.0
  max_song_seconds: 360.0
  merge_gap_seconds: 40.0
content_types:
  song: true
  dialogue: false
  highlight: false
  funny: false
  cringe: false
  daily_summary: true
song:
  enabled: true
  normalization:
    force_merge_same_title: false
    chorus_aware_split: false
    chorus_gap_seconds: 130.0
    chorus_similarity_threshold: 0.3
    chorus_context_segments: 3
  search:
    enabled: false
    search_unknown_only: true
    max_searches: 25
  risk:
    duration_weight: 1.0
    boundary_expansion_weight: 2.0
    overlap_weight: 2.0
    evidence_weight: 2.0
    review_threshold: 0.55
    reject_threshold: 0.9
    soft_min_seconds: 150
    soft_max_seconds: 360
    boundary_gap_seconds: 20
    low_confidence: 0.65
  padding:
    before_seconds: 15.0
    after_seconds: 15.0
    after_next_asr_end_guard_seconds: 2.0
    adaptive_silence_padding: true
    adaptive_silence_gap_threshold_seconds: 25.0
    adaptive_silence_gap_ratio: 0.95
    adaptive_max_before_seconds: 45.0
    adaptive_max_after_seconds: 45.0
    min_song_seconds: 75.0
    merge_gap_seconds: 40.0
    max_song_seconds: 360.0
  missed_recheck:
    fallback_strategy: windowed_on_structural_failure
    batch_size: 500
    min_gap_segments: 1
    context_segments: 10
    max_completion_tokens: 32768
    max_tool_rounds: 1
    max_anchor_segments: 12
    anchor_max_expansion_seconds: 420
    enabled: true
    output_mode: matches
    min_uncovered_seconds: 10.0
  review:
    transcript_scope: local
    context_segments: 10
    max_window_segments: 500
    nearby_title_conflict_gap_segments: 2
    max_completion_tokens: 32768
    max_tool_rounds: 1
    fallback: local_best
    enabled: true
    merge_policy: conservative
  naming:
    search_query_source: title
    preserve_unknown_on_weak_evidence: true
dialogue:
  enabled: true
  min_duration: 10.0
  max_duration: 300.0
  min_confidence: 0.6
  merge_gap_seconds: 10.0
  tags:
  - 搞笑
  - 吐槽
  - 名场面
  - 金句
  - 互动
  - 高能
highlight:
  enabled: false
  min_duration: 5.0
  max_duration: 120.0
  min_confidence: 0.6
  merge_gap_seconds: 15.0
funny:
  enabled: false
  min_duration: 5.0
  max_duration: 180.0
  min_confidence: 0.6
  merge_gap_seconds: 15.0
cringe:
  enabled: true
  min_duration: 5.0
  max_duration: 120.0
  min_confidence: 0.6
  merge_gap_seconds: 15.0
daily_summary:
  enabled: true
  summary_only: true
  language: zh-CN
  title: 当天直播内容总结
  max_level1_items: 6
  max_level2_per_level1: 5
  max_level3_per_level2: 4
  include_timeline: true
  include_quotes: true
  include_open_questions: true
output:
  video_clips: true
  audio_segments: true
  audio_extension: mp3
  audio_bitrate_kbps: 320
  video_extension: mp4
  video_codec: copy
  match_context_segments: 10
  max_export_workers: 4
  concat_videos: true
  single_file_policy: copy
  concat_force_normalize: false
  # 歌曲导出目录会自动写入 merge_mp4.bat 和 merge_recut_context.json。
  # 将同一目录下两个已导出的 .mp4 拖到 bat 上会从原始 input/concat 重新切出一个 .mp4；
  # 将两个 .mp3 拖到 bat 上会重新切出一个 .mp3。不会覆盖原文件。
  clip_naming:
    enabled: true
    dictionary_path: streamer_dictionary.json
    default_streamer: StreamerName
    min_score: 0.65
    apply_to:
    - song

# ─── cut-copy 工作流（录播自动处理 + 远程归档 + 关机）─────────
# 启用后，GPU 机器通过 Windows 计划任务自动执行：
# 1. 扫描 DDTV 输出目录（SMB）查找新视频
# 2. 运行 dd-clip-miner-llm 处理
# 3. 复制结果到目标 SMB 共享
# 4. 验证后删除源文件和工作目录
# 5. 关机
#
# 配置详情见 cut_copy.example.conf
# 计划任务设置: scripts/setup_cut_copy_task.ps1
cut_copy:
  enabled: false
  conf_path: "cut_copy.conf"
