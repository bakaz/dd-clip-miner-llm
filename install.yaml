# 安装配置文件
# 用法: python install.py --config install.yaml

# ASR 后端选择
# funasr: Qwen3-ASR / SenseVoiceSmall / Paraformer（GPU 生产默认，需 PyTorch + --funasr）
# faster_whisper: 轻量级备选，支持 GPU (CUDA 12)
asr_backend: funasr

# GPU 类型
# auto: 自动检测（Blackwell/CC≥12 走 cuda13，否则 cuda12）
# cuda13: CUDA 13 (Blackwell RTX 50xx, CC ≥ 12.0, cu130 PyTorch)
# cuda12: CUDA 12 (Ampere/Ada, CC 8.x-9.x)
# cpu: 强制使用 CPU
gpu_type: auto

# 是否安装 FunASR 支持（即使 asr_backend 不是 funasr）
install_funasr: true

# 是否安装开发/测试工具（pip install -e ".[test]"）
install_dev_tools: false

# 是否安装 MKVToolNix（需要系统包管理器）
install_mkvmerge: true

# 跳过已安装的包
skip_installed: true
