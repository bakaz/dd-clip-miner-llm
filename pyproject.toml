# Python 项目元数据与依赖配置
# 安装: pip install -e .          # 基础依赖
#       pip install -e ".[test]"   # 含测试工具
#       python install.py          # GPU + FunASR 完整安装（推荐）

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dd-clip-miner-llm"
version = "0.3.0"
description = "基于 Whisper ASR + LLM 的直播内容挖掘工具，兼容 dd-song-miner-llm"
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.10,<3.13"  # 支持 3.10–3.12，不含 3.13
keywords = ["whisper", "asr", "llm", "song", "live", "clip", "miner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Video :: Analysis",
]
dependencies = [
    "PyYAML>=6.0.2",           # config.yaml 解析
    "tqdm>=4.66",              # 进度条
    "imageio-ffmpeg>=0.5.1",   # 内置 ffmpeg 二进制
    "faster-whisper>=1.2.1",   # 本地 ASR（CPU/GPU）
    "numpy>=1.26",
    "soundfile>=0.12",         # 音频读写
    "openai>=1.0.0",           # LLM API 客户端
    "httpx>=0.23.0",           # HTTP 请求
    "ddgs>=9.0.0",             # 歌名联网搜索 (DuckDuckGo)
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
funasr = [  # Qwen3-ASR / SenseVoice；GPU torch 需 install.py 单独处理
    "funasr>=1.3.7",
    "qwen-asr>=0.0.6",
    "torch>=2.7",
    "torchaudio>=2.7",
]
# NOTE: [funasr] 会从 PyPI 拉 CPU-only torch。
# 若需 GPU 支持，使用 install.py（自动处理安装顺序：先装 CUDA torch，再装 funasr）。
# 或手动：
#   pip install -e ".[funasr]"
#   pip install -r requirements-cu13.txt   # Blackwell / CUDA 13
#   pip install -r requirements-cu12.txt   # Ampere/Ada / CUDA 12

[project.urls]
Homepage = "https://github.com/bakaz/dd-clip-miner-llm"
Repository = "https://github.com/bakaz/dd-clip-miner-llm"
Issues = "https://github.com/bakaz/dd-clip-miner-llm/issues"

[project.scripts]
dd-clip-miner-llm = "dd_clip_miner_llm.cli:main"  # CLI 入口: python -m dd_clip_miner_llm

[tool.setuptools.packages.find]
include = ["dd_clip_miner_llm*"]

[tool.setuptools.package-data]
dd_clip_miner_llm = ["assets/*.bat"]  # 歌曲目录 merge_mp4.bat 等资源

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "network: requires outbound network (skipped when DD_CLIP_MINER_LLM_CI=1)",
    "secrets: requires API keys or local config (skipped when DD_CLIP_MINER_LLM_CI=1)",
]
