# =============================================================================
# dd-clip-miner-llm 主配置模板
# =============================================================================
# 用法:
#   python -m dd_clip_miner_llm run live.mp4 --config config.example.yaml
#   python -m dd_clip_miner_llm run live.mp4 --config config.yaml --profile accuracy
#
# 首次部署: 复制本文件为 config.yaml，填入 API Key，按需改 default_profile。
#
# 整体处理流程（单次 run）:
#   1. audio     — 从视频提取 16kHz 单声道 WAV
#   2. asr       — 语音转文字，产出带时间戳的 transcript.json
#   3. llm       — 按 content_types 启用各识别器（歌曲/对话/总结等）
#   4. song 后处理 — normalization → risk 评分 → review/recheck → padding 算边界
#   5. output    — ffmpeg 切出 mp3/mp4，按 clip_naming 规则命名
#   6. cut_copy  —（可选）batch-run 完成后自动归档到 NAS 并关机
# =============================================================================

# ─── audio：音频预处理 ───────────────────────────────────────
# 【作用】控制从输入视频/音频提取 ASR 输入时的采样格式。
# 【流程】ffmpeg 解码 → 重采样/混音 → 写入 runs/<id>/audio.wav → 交给 ASR。
#         所有后端（Qwen3 / faster-whisper）均假设 16kHz 单声道。
audio:
  sample_rate: 16000   # 目标采样率 (Hz)；固定 16000，勿改除非你知道后端支持其他率
  channels: 1          # 声道数；1=单声道，立体声会被混音为 mono

# ─── asr：语音识别 ───────────────────────────────────────────
# 【作用】将音频转为带时间戳的文字稿（transcript），是全管线的数据基础。
# 【流程】
#   mode=local:
#     ① 检测 GPU → 有则合并 gpu 节，无则合并 cpu 节
#     ② backend=qwen3_asr: Qwen3-1.7B 分块识别 → 稀疏段 funasr.fallback 重跑
#     ③ backend=faster_whisper: batch 模式优先 → fallback 回退 standard
#     ④ 产出 TranscriptSegment 列表（start/end/text）
#   mode=remote: 音频分块上传云端 API（Mimo 等）
#
# GPU 安装: python install.py --config install.yaml --gpu cuda13
asr:
  mode: local          # local=本机推理（推荐）| remote=云端 API（需网络和 Key）
  hf_endpoint: https://hf-mirror.com  # load_config 时自动设置 HF_ENDPOINT；null=禁用镜像直连 HF

  local:
    backend: qwen3_asr # 主后端: qwen3_asr | faster_whisper | funasr(SenseVoice)

    # --- funasr：FunASR / Qwen3-ASR 参数 ---
    # 【作用】Qwen3 主路径及稀疏段回退；gpu.funasr 会覆盖 model/hub 等。
    funasr:
      device: auto                    # auto=自动选 cuda/cpu | cuda:0 | cpu
      trust_remote_code: true         # true=允许 HF 模型执行仓库内自定义代码
      batch_size: null                # null=框架自动 | 整数=推理批大小
      language: null                  # null=自动检测 | zh | en | ja 等 ISO 代码
      vad_model: null                 # 可选 VAD 模型 ID，null=不使用额外 VAD
      punc_model: null                # 可选标点恢复模型，null=不后处理标点
      spk_model: null                 # 可选说话人分离模型，null=不区分说话人
      generate_kwargs:
        return_time_stamps: true      # true=要求模型返回字/词级时间戳
      keep_chunk_audio: false         # true=保留分块 wav 到磁盘（调试 ASR 用）
      lyrics:
        enabled: false                # true=按歌词格式重排文本（歌切专用，直播一般关）
        max_line_chars: 24            # 歌词单行最大字符，超出强制换行
        sentence_punctuation: "。！？.!?\n"  # 用于分句的标点字符集
        max_sentence_duration_ms: 5000  # 单句最长毫秒，过长则强制切分
      fallback:
        enabled: true                 # true=主 ASR 输出稀疏/重复时，对问题区间分块重跑
        chunk_seconds: 5              # 回退时每块音频长度 (秒)
        max_segment_seconds: 15       # 回退结果单段最长 (秒)，超出再切
        sparse_chars_per_sec: 1.0     # 字符密度低于此值 (字/秒) 视为稀疏需回退
        repeat_threshold: 3           # 同文本连续重复 ≥N 次视为 ASR 幻觉，触发回退
        padding_seconds: 2.0          # 回退切片在问题区间两侧各扩展 (秒)
        max_workers: 1                # 回退并行线程数；1 更稳，显存/CPU 紧时可保持 1
        min_gap_seconds: 10.0         # transcript 间隙 ≥N 秒触发 fill；默认 10s 平衡覆盖与回退次数
        merge_policy: fill_fix_asr    # fill_fix_asr=补间隙+修坏段 | replace_ranges | fill_gaps
        zero_duration_policy: merge_adjacent  # 零时长段: merge_adjacent=并入邻段

    # --- faster_whisper：Whisper 本地推理 ---
    # 【作用】CPU 主路径；GPU 上作为 Qwen3 的补充/对比；batch↔standard 可互备。
    faster_whisper:
      device: auto                    # auto | cuda | cpu
      compute_type: default           # default=自动 | int8(CPU推荐) | float16 | bf16
      cpu_threads: 8                  # CPU 推理线程，建议 ≈ 物理核心数
      num_workers: 1                  # 并行加载/推理 worker，多 worker 占更多显存
      language: null                  # null=自动检测语言
      beam_size: 5                    # beam search 宽度，越大越准越慢
      initial_prompt: null            # 文本提示引导专有名词，如 "綾音Aya 直播"
      word_timestamps: true           # true=输出词级时间戳（切歌边界更准）
      split_on_word_gaps: true        # true=词间长静音处切开 segment
      word_gap_seconds: 2.0           # 词间静音 ≥N 秒则切分新段
      max_segment_seconds: 15.0       # 单 segment 最长 (秒)，防 Whisper 输出过长段
      batch:
        model: small                  # 批处理模型: tiny/base/small/medium/large-v3/turbo
        inference_mode: batched       # batched=CTranslate2 批量推理（快）
        batch_size: 8                 # 批大小，>0 才启用 batched；显存不足可改 4
        vad_filter: true              # true=VAD 预过滤静音（减噪、提速）
      standard:
        model: small                  # 标准模式模型（可与 batch 不同）
        inference_mode: standard      # standard=逐段推理（稳，适合回退）
        batch_size: 0                 # 0=禁用批处理
        vad_filter: false             # 标准模式一般关 VAD，避免过度切分
      fallback:
        enabled: true                 # true=batch 质量差时自动用 standard 重跑问题区间
        primary_mode: batch           # 首选推理模式名，对应上面 batch/standard 节
        fallback_mode: standard       # 回退目标模式
        min_gap_seconds: 10.0         # transcript 间隙 ≥N 秒触发 fill；可调低(4)或调高(30)
        padding_seconds: 2.0          # 回退音频区间两侧扩展 (秒)
        max_workers: 1                # 回退并行度
        max_segment_seconds: 15.0     # 回退段最长 (秒)
        sparse_chars_per_sec: 1.0     # 稀疏判定阈值 (字/秒)
        repeat_threshold: 3           # 重复幻觉判定次数
        merge_policy: fill_fix_asr    # fill_fix_asr=补间隙+修坏段 | replace_ranges | fill_gaps

    # --- gpu：有 CUDA 时自动合并到此节 ---
    # 【流程】device=auto 且检测到 GPU → funasr/faster_whisper 参数被本节覆盖。
    gpu:
      funasr:
        model: Qwen/Qwen3-ASR-1.7B              # Qwen3 ASR 模型 ID
        hub: hf                                 # hf=HuggingFace Hub（配合 asr.hf_endpoint 镜像）| ms=ModelScope
        device: cuda:0                          # 使用的 GPU 设备号
        dtype: bf16                             # 推理精度: bf16(推荐) | fp16 | fp32
        timestamp_chunk_seconds: 180            # 长直播按 N 秒切块识别再拼接时间轴
        max_workers: 1                          # 分块并行数；1 更省显存，足时可改 2
        forced_aligner: Qwen/Qwen3-ForcedAligner-0.6B  # 强制对齐模型，细化时间戳
        forced_aligner_kwargs: {}               # 传给对齐模型的额外 kwargs
      faster_whisper:
        batch:
          model: turbo                          # GPU 回退/对比用 turbo（快且准）
        standard:
          model: turbo

    # --- cpu：无 CUDA 时自动合并到此节 ---
    cpu:
      backend: faster_whisper                   # CPU 强制走 faster_whisper（不用 Qwen3）
      faster_whisper:
        compute_type: int8                      # CPU 必用 int8，default 会很慢
        batch:
          model: small                          # CPU 用 small 平衡速度/精度
        standard:
          model: small

  # --- remote：云端 ASR（asr.mode=remote 时整条本地节被跳过）---
  remote:
    provider: mimo                              # 提供商标识，决定请求格式
    base_url: https://token-plan-cn.xiaomimimo.com/v1  # OpenAI 兼容 API 根地址
    api_key: null                               # 直接写 Key；null 则从 api_key_env 读
    api_key_env: MIMO_API_KEY                   # 环境变量名，优先级低于 api_key
    model: mimo-v2.5-asr                        # 云端 ASR 模型名
    timestamp_chunk_seconds: 5                  # 上传前音频分块时长 (秒)
    language: null                              # null=自动 | zh 等

# ─── llm：大语言模型 ─────────────────────────────────────────
# 【作用】驱动歌曲识别、对话分类、直播总结等所有「理解」步骤。
# 【流程】
#   ① provider_route 按序尝试各 provider，首个 api_key 可用者生效
#   ② 识别器将 ASR 段分批送入 LLM，要求返回结构化 JSON
#   ③ 空输出/截断 → reasoning_followup 或 continuation 续写
#   ④ JSON 解析失败 → json_fix_rounds 轮修复
#   ⑤ use_tools=true 时 LLM 可调用搜索验证歌名
llm:
  provider_route:                             # 提供商优先级列表，从上到下尝试
  - opencode
  - deepseek
  - mimo
  providers:
    opencode:
      api_key: null                           # API Key；null 则从 api_key_env 环境变量读取
      api_key_env: OPENCODE_API_KEY           # 环境变量名
      base_url: https://opencode.ai/zen/go/v1 # OpenAI 兼容 API 地址
      model: deepseek-v4-flash                # 模型 ID，影响识别质量与费用
      temperature: 0.1                        # 0.0-1.0，越低输出越稳定可复现
      max_tokens: 8192                        # 单次 completion 最大生成 token
      timeout_schedule:                       # 第 1/2/3 次请求超时 (秒)，逐次放宽
      - 60
      - 120
      - 180
      retry_backoff_seconds:                  # 失败后等待 (秒) 再重试
      - 2
      - 5
      retry_jitter_ratio: 0.25                # 退避时间随机抖动比例，防并发雪崩
      result_retries: 2                       # 空结果或 JSON 无效时的重试次数
    deepseek:
      api_key: null
      api_key_env: DEEPSEEK_API_KEY
      base_url: https://api.deepseek.com
      model: deepseek-v4-flash
      thinking: disabled                      # disabled=普通模式 | enabled=深度推理（更慢更贵）
      temperature: 0.1
      max_tokens: 8192
      timeout_schedule:
      - 60
      - 120
      - 180
      retry_backoff_seconds:
      - 2
      - 5
      retry_jitter_ratio: 0.25
      result_retries: 2
    mimo:
      api_key: null
      api_key_env: MIMO_API_KEY
      base_url: https://token-plan-cn.xiaomimimo.com/v1
      model: mimo-v2.5-pro
      temperature: 0.1
      max_tokens: 8192
      timeout_schedule:
      - 60
      - 120
      - 180
      retry_backoff_seconds:
      - 2
      - 5
      retry_jitter_ratio: 0.25
      result_retries: 2
  retry_empty_with_reasoning: true            # true=首次返回空 JSON 时追加 reasoning 追问
  reasoning_followup_rounds: 5                # reasoning 追问最多轮数
  reasoning_followup_max_tokens: 32768        # 每轮 reasoning 最大 token
  max_completion_tokens: 32768                # 全局 completion 上限（防账单爆炸）
  batch_size: null                            # LLM 每批送入的 segment 数；null=自动按上下文算
  max_tool_rounds: 2                          # 工具调用（搜索）最大往返轮数
  final_tool_max_tokens: 32768                # 工具调用后最终回复 token 上限
  continuation_on_length: true                # true=输出因 length 截断时自动续写拼接
  max_continuation_rounds: 8                  # 续写最多轮数
  debug_store_requests: false                 # true=每轮 LLM 请求/响应写入 llm_debug/（调试用）
  reuse_valid_batches: true                   # true=中断重跑时复用已验证的批结果
  use_tools: true                             # true=允许 LLM 调用 search 等工具
  verify_with_search: true                    # true=歌名识别后联网搜索交叉验证
  json_fix_rounds: 3                          # JSON 解析失败时让 LLM 自我修复的轮数

# ─── profiles：歌曲挖掘方案 ──────────────────────────────────
# 【作用】同一配置文件内预设多套 song/llm 策略，CLI --profile 或 default_profile 选用。
# 【流程】load_config 时: DEFAULT_CONFIG ← 公共段 ← profiles[选中项] 深度合并。
#         仅 profiles 段内的键会随 profile 切换；公共段（asr/llm/output 等）始终生效。
default_profile: kv_optimized                 # 未指定 --profile 时使用的方案名

profiles:
  # accuracy：最高召回，适合歌单完整性优先、可接受更多 LLM 成本
  accuracy:
    llm:
      cache_friendly_prompt_layout: false     # false=完整 prompt 布局，精度优先于 token 节省
      compact_segment_ranges: false             # false=段范围不压缩，LLM 看到完整索引
    song:
      pipeline:
        strategy: legacy                      # legacy=旧版单阶段识别+后处理
        runtime_adaptive: disabled            # disabled=不动态切换策略
        temporal_adjudication:
          enabled: false                      # false=不做时序裁决（多候选消歧）
      review:
        enabled: true                         # true=LLM 二次复核可疑切片
        transcript_scope: local               # local=仅看候选附近段落 | full=全文
      missed_recheck:
        enabled: true                         # true=对未覆盖区间做漏检复查
        strategy: windowed                    # windowed=滑动窗口 | full_transcript=全文扫描
        output_mode: matches                  # matches=直接补歌曲 | anchors=仅补锚点

  # kv_v2：KV 缓存友好 + 全文 review，适合长直播降 token 成本
  kv_v2:
    llm:
      cache_friendly_prompt_layout: true      # true=固定前缀布局，利于 KV cache 命中
      compact_segment_ranges: true              # true=压缩连续段为范围写法，省 token
    song:
      pipeline:
        strategy: legacy
        runtime_adaptive: disabled
        temporal_adjudication:
          enabled: false
      review:
        enabled: true
        transcript_scope: full                # 全文复核，消歧同名歌/相邻演唱
        merge_policy: llm_guided              # llm_guided=按 LLM 决策合并同歌名簇
      missed_recheck:
        enabled: true
        strategy: full_transcript             # 全文扫描漏检
        output_mode: matches
        fallback_strategy: windowed_on_structural_failure  # 全文失败时回退窗口模式
      kv_v2:
        min_cluster_size_for_review: 2        # 簇内候选 ≥N 才送 review
        deletion_confidence_threshold: 0.75     # 置信度 ≥此值才允许删除候选
        unknown_deletion_confidence_threshold: 0.6  # 「未知歌名」删除阈值（更宽松）

  # kv_optimized：生产推荐。三阶段 KV 管线，平衡精度、召回与成本
  kv_optimized:
    llm:
      cache_friendly_prompt_layout: true
      compact_segment_ranges: true
    song:
      normalization:
        force_merge_same_title: true          # true=同标题候选强制合并为一个演唱
        chorus_aware_split: true              # true=同歌多次演唱按副歌间隔切开
        chorus_gap_seconds: 130.0             # 两次演唱间隔 >N 秒视为不同次
        chorus_similarity_threshold: 0.3      # 副歌文本相似度阈值 (0-1)
        chorus_context_segments: 3            # 判断副歌时取的上下文段数
      pipeline:
        strategy: risk_routed_kv              # 三阶段: 发现→召回审计→时序裁决
        runtime_adaptive: fixed_three_stage   # 固定跑满三阶段，不动态跳过
        temporal_adjudication:
          enabled: true                       # true=第三阶段对冲突候选做时序裁决
          preserve_source_names: true         # true=裁决输出保留各阶段原始歌名
          max_completion_tokens: 8192         # 裁决阶段 token 上限
        stages:
          discovery: precision                # 发现: precision=高精度少误报
          recall_audit: uncovered_evidence    # 召回: 扫描未覆盖区间找漏歌
          adjudication: full_transcript       # 裁决: 基于全文消歧
        continuation_overlap_segments: 50     # 长上下文续写时前后重叠段数
        allow_final_discovery: true           # true=裁决后允许最后一轮补发现
        anchor_boundary_expansion: false      # false=不自动扩展锚点边界
      naming:
        search_query_source: lyric_anchors    # 搜索歌名时用 lyric_anchors 而非 title
        preserve_unknown_on_weak_evidence: true  # 证据弱时保留「未知歌曲」不强行命名
      search:
        enabled: true                         # true=对 unknown 歌名联网搜索验证
        search_unknown_only: true             # 若启用，仅搜 unknown 歌名
        max_searches: 25                      # 单次 run 最大搜索次数
      missed_recheck:
        enabled: true
        output_mode: anchors                  # anchors=输出锚点供后续扩展（非直接 matches）
        min_uncovered_seconds: 10.0           # 未覆盖区间短于此秒数则忽略
        check_all_uncovered: true             # true=检查所有未覆盖区间
        max_tool_rounds: 0                    # 复查阶段禁用工具调用
      review:
        enabled: false                        # 三阶段已含裁决，无需额外 review

# ─── padding：全局切片边界填充（兼容旧版）────────────────────
# 【作用】在 LLM 识别的 segment 索引基础上，向前后扩展秒数得到切歌起止时间。
# 【流程】segment 起止时间 → ±before/after_seconds → 自适应静音延伸 → 合并相邻 → ffmpeg 切割。
#         song.padding 存在时优先于本节；顶层 padding 会同步合并到 song.padding。
padding:
  before_seconds: 15.0                        # 每首歌起点向前扩展 (秒)，含前奏/说话尾音
  after_seconds: 15.0                         # 终点向后扩展 (秒)，含尾奏/ applause
  after_next_asr_end_guard_seconds: 2.0       # 终点不得侵入下一段 ASR 开始后 N 秒
  adaptive_silence_padding: true              # true=若邻段有大段静音则自动多扩边界
  adaptive_silence_gap_threshold_seconds: 25.0  # 静音间隙 ≥N 秒才触发自适应扩展
  adaptive_silence_gap_ratio: 0.95            # 扩展量 = 间隙时长 × 此比例（上限见下方 max）
  adaptive_max_before_seconds: 45.0           # 自适应前扩展硬上限 (秒)
  adaptive_max_after_seconds: 45.0            # 自适应后扩展硬上限 (秒)
  min_song_seconds: 75.0                      # 短于此秒数的候选丢弃（防误识别短哼唱）
  max_song_seconds: 360.0                     # 长于此秒数强制切分（防一整场算一首歌）
  merge_gap_seconds: 40.0                     # 相邻两首歌间隔 <N 秒则合并为一个

# ─── content_types：内容识别总开关 ───────────────────────────
# 【作用】控制 run 时启动哪些 LLM 识别器；false 的类型的 song.enabled 等仍可能被合并，但识别器不跑。
# 【流程】orchestrator 遍历 true 的类型 → 各 recognizer 读 ASR → 写 matches → 进入后处理/导出。
content_types:
  song: true                                  # 歌曲识别与切片（主功能）
  dialogue: false                             # 对话/聊天精彩片段
  highlight: false                            # 高能时刻（欢呼、爆点等）
  funny: false                                # 搞笑片段
  cringe: false                               # 下头/尴尬对话
  daily_summary: true                         # 当日直播文字总结（可与 song 并行）

# ─── song：歌曲识别全局默认 ──────────────────────────────────
# 【作用】profile 未覆盖时的歌曲管线默认参数；与 profiles.*.song 深度合并。
# 【流程】
#   LLM 识别候选 → normalization 合并/切分 → risk 评分 → review（可选）
#   → missed_recheck 补漏 → padding 算时间 → output 导出
song:
  enabled: true                               # false=跳过整个歌曲管线（content_types.song 也需 false）

  normalization:
    force_merge_same_title: false             # false=同歌名不强制合并（profile 可覆盖为 true）
    chorus_aware_split: false                 # false=不按副歌切分多次演唱
    chorus_gap_seconds: 130.0                 # 副歌感知切分的演唱间隔阈值 (秒)
    chorus_similarity_threshold: 0.3          # 判定同一副歌的文本相似度 (0-1)
    chorus_context_segments: 3                # 提取副歌特征时的上下文段数

  search:
    enabled: false                            # true=管线内主动 DuckDuckGo 搜歌名
    search_unknown_only: true                 # true=只搜「未知歌曲」候选
    max_searches: 25                          # 单次 run 搜索上限（防 API 限流）

  risk:
    duration_weight: 1.0                      # 风险评分: 时长异常权重
    boundary_expansion_weight: 2.0            # 边界过度扩展权重
    overlap_weight: 2.0                       # 与其他候选重叠权重
    evidence_weight: 2.0                      # 歌词证据不足权重
    review_threshold: 0.55                    # 总分 ≥此值送 review（不直接拒绝）
    reject_threshold: 0.9                     # 总分 ≥此值直接拒绝候选
    soft_min_seconds: 150                     # 软最短：低于此加分但不立刻拒
    soft_max_seconds: 360                     # 软最长：高于此加分但不立刻拒
    boundary_gap_seconds: 20                  # ASR 间隙 ≥N 秒则在风险路由中切开候选
    low_confidence: 0.65                      # LLM 置信度低于此视为低置信特征

  padding:
    before_seconds: 15.0                      # 歌曲专用前填充 (秒)，覆盖顶层 padding
    after_seconds: 15.0
    after_next_asr_end_guard_seconds: 2.0
    adaptive_silence_padding: true
    adaptive_silence_gap_threshold_seconds: 25.0
    adaptive_silence_gap_ratio: 0.95
    adaptive_max_before_seconds: 45.0
    adaptive_max_after_seconds: 45.0
    min_song_seconds: 75.0
    merge_gap_seconds: 40.0                   # 歌曲合并间隙 (秒)
    max_song_seconds: 360.0

  missed_recheck:
    enabled: true                             # true=对 transcript 未覆盖区间做 LLM 补扫
    fallback_strategy: windowed_on_structural_failure  # 结构失败时回退 windowed 策略
    batch_size: 500                           # 每批送入 LLM 的 segment 数上限
    min_gap_segments: 1                       # 未覆盖区间至少隔 N 段才算有效空隙
    context_segments: 10                      # 补扫时附带的前后上下文段数
    max_completion_tokens: 32768              # 补扫单次 LLM token 上限
    max_tool_rounds: 1                        # 补扫允许的工具调用轮数
    max_anchor_segments: 12                   # anchors 模式下单锚点最多段数
    anchor_max_expansion_seconds: 420         # 锚点边界最大扩展 (秒)
    output_mode: matches                      # matches=直接输出歌曲 | anchors=仅锚点
    min_uncovered_seconds: 10.0               # 未覆盖区间短于此则跳过

  review:
    enabled: true                             # true=对可疑簇做 LLM 二次审核
    transcript_scope: local                   # local=局部窗口 | full=全文
    context_segments: 10                      # local 模式下上下文半宽（段数）
    max_window_segments: 500                  # review 单次最大段数窗口
    nearby_title_conflict_gap_segments: 2     # 近邻同歌名冲突判定间隔 (段)
    max_completion_tokens: 32768
    max_tool_rounds: 1
    fallback: local_best                      # 复核失败时: local_best=保留局部最优
    merge_policy: conservative                # conservative | llm_guided | aggressive

  naming:
    search_query_source: title                # 构造搜索词来源: title | lyric_anchors
    preserve_unknown_on_weak_evidence: true   # 证据不足时保留未知歌名不瞎填

# ─── dialogue：对话片段识别 ──────────────────────────────────
# 【作用】从直播中切出有趣对话/互动片段（需 content_types.dialogue=true）。
# 【流程】LLM 按 tags 分类候选 → 过滤时长/置信度 → merge_gap 合并 → padding → 导出。
dialogue:
  enabled: true                               # 类型级开关（还需 content_types.dialogue=true）
  min_duration: 10.0                          # 最短切片时长 (秒)
  max_duration: 300.0                         # 最长切片时长 (秒)
  min_confidence: 0.6                         # LLM 置信度低于此丢弃
  merge_gap_seconds: 10.0                     # 相邻片段间隔 <N 秒则合并
  tags:                                       # LLM 分类标签白名单
  - 搞笑
  - 吐槽
  - 名场面
  - 金句
  - 互动
  - 高能

# ─── highlight：高能时刻 ─────────────────────────────────────
# 【作用】识别欢呼、礼物爆点、情绪高潮等短片段。
highlight:
  enabled: false                              # 需 content_types.highlight=true 才运行
  min_duration: 5.0
  max_duration: 120.0
  min_confidence: 0.6
  merge_gap_seconds: 15.0

# ─── funny：搞笑片段 ─────────────────────────────────────────
funny:
  enabled: false
  min_duration: 5.0
  max_duration: 180.0
  min_confidence: 0.6
  merge_gap_seconds: 15.0

# ─── cringe：下头对话 ────────────────────────────────────────
cringe:
  enabled: true
  min_duration: 5.0
  max_duration: 120.0
  min_confidence: 0.6
  merge_gap_seconds: 15.0

# ─── daily_summary：当日直播总结 ─────────────────────────────
# 【作用】用 LLM 将整场 ASR 归纳为三层金字塔 Markdown/JSON 总结。
# 【流程】ASR 全文 → LLM 分批/续写 → 合并为 level1/2/3 结构 → 写 summary.md（summary_only 时不切片）。
#         专用配置见 config.daily-summary.example.yaml。
daily_summary:
  enabled: true
  summary_only: true                          # true=只写总结文件，不为总结单独切音视频
  language: zh-CN                             # 总结输出语言
  title: 当天直播内容总结                       # 总结文档标题
  max_level1_items: 6                         # 一级主题（「今天讲了什么」）数量上限
  max_level2_per_level1: 5                    # 每个一级下二级主题上限
  max_level3_per_level2: 4                    # 每个二级下三级事实/例子上限
  include_timeline: true                      # true=输出关键时间节点时间线
  include_quotes: true                        # true=每条包含 ASR 原话摘录
  include_open_questions: true                # true=列出未解答/待跟进问题

# ─── output：导出与命名 ──────────────────────────────────────
# 【作用】控制是否切出 mp3/mp4、编码参数、并行度、合并策略与文件命名。
# 【流程】ContentResult 时间边界 → ffmpeg cut → 可选 concat 同歌多段 → clip_naming 重命名。
output:
  video_clips: true                           # true=导出 mp4 视频切片
  audio_segments: true                        # true=导出 mp3 音频切片
  audio_extension: mp3                        # 音频容器: mp3 | wav | m4a 等
  audio_bitrate_kbps: 320                     # mp3 码率 (kbps)，320=近无损
  video_extension: mp4
  video_codec: copy                           # copy=流复制不重编码（快）| libx264 等
  match_context_segments: 10                  # 导出元数据附带的上下文段数（便于人工核对）
  max_export_workers: 4                       # ffmpeg 并行导出线程数
  concat_videos: true                         # true=同歌多段合并为一个 mp4（若可行）
  single_file_policy: copy                    # 单文件处理: copy=直接复制流
  concat_force_normalize: false               # true=合并前强制重编码归一化（慢，一般不需要）
  clip_naming:
    enabled: true                             # true=按【主播】序号-歌名-歌手-YYMMDD 命名
    dictionary_path: streamer_dictionary.json # 主播匹配词典（见 streamer_dictionary.example.json）
    default_streamer: StreamerName            # 路径匹配失败时的默认主播名
    min_score: 0.65                           # 路径与别名最低相似度 (0-1)
    apply_to:                                 # 启用此命名规则的内容类型
    - song
  # 歌曲导出目录会写入 merge_mp4.bat + merge_recut_context.json：
  # 拖两个 mp4/mp3 到 bat 可从原始录播重新切出合并文件，不覆盖原导出。

# ─── cut_copy：录播自动批处理工作流 ──────────────────────────
# 【作用】配合 Windows 计划任务，实现「DDTV 录完 → GPU 唤醒 → 处理 → 上传 NAS → 关机」。
# 【流程】
#   1. wol_webhook 在 RecordingEnd 时 WOL 唤醒 GPU 机
#   2. 计划任务跑 batch-run，扫描 SMB 上 DDTV 新 _fix.mp4
#   3. 每个文件 run dd-clip-miner-llm
#   4. cut_copy 复制结果到 destination，校验后删源文件
#   5. shutdown_after 关机
# batch-run 触发 cut_copy: cut_copy.enabled=true，或命令行加 --cut-copy-conf（可省略路径）
# 路径细节在 cut_copy.example.conf（复制为 cut_copy.conf）。
cut_copy:
  enabled: false                              # true=batch-run 结束后自动执行 cut_copy
  conf_path: "cut_copy.conf"                  # cut_copy 配置文件路径（相对 config 所在目录）