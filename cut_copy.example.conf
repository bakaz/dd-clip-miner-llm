# =============================================================================
# cut_copy 录播自动处理工作流配置模板
# =============================================================================
# 读取方: python -m dd_clip_miner_llm cut-copy --conf cut_copy.conf
#         或 batch-run 结束后由 config.yaml 的 cut_copy.conf_path 自动触发
#
# 首次使用:
#   copy cut_copy.example.conf cut_copy.conf   （cut_copy.conf 已在 .gitignore）
# 先 dry-run 验证扫描范围:
#   python -m dd_clip_miner_llm cut-copy --conf cut_copy.conf --dry-run
# 正式运行:
#   python -m dd_clip_miner_llm cut-copy --conf cut_copy.conf
#
# 整体流程:
#   ① 扫描 source.path 下匹配 pattern 的新录播（跳过含 done_marker 的目录）
#   ② 对每个文件调用 dd-clip-miner-llm run（使用 processing.config_path）
#   ③ 将 runs/ 结果复制到 destination.path/{date}_{streamer}/
#   ④ 校验复制完整性 → 按 behavior 删源/删工作目录 → 可选关机
#
# 典型拓扑: DDTV 机录播 → SMB → GPU 机 batch-run → NAS 归档 → GPU 关机
# =============================================================================

# 是否启用 cut-copy。config.yaml 的 cut_copy.enabled 仍控制 batch-run 是否自动触发本流程。
enabled: true                               # false=本文件存在但不执行 cut-copy 逻辑

# ─── source：DDTV 录播源目录 ─────────────────────────────────
# 【作用】定义「待处理录播」从哪里来。
# 【流程】启动时 glob(source.path + pattern) → 排除已有 done_marker 的文件夹。
# 路径解析链: batch-run 扫描目录 = config.yaml → cut_copy.conf_path → 本文件 source.path
source:
  path: "//ddtv-machine/Recordings"           # SMB 共享或映射盘符，如 "R:/Recordings"
  pattern: "*_fix.mp4"                        # 文件名通配；DDTV 时间轴修复后为 _fix.mp4
  done_marker: ".dd_clip_miner_cut_copy_done.json"  # 处理完成后写入此文件，下次跳过

# ─── destination：处理结果归档目标 ───────────────────────────
# 【作用】处理成功后，将切片/总结复制到 NAS 或另一台机器。
# 【流程】创建 destination.path / folder_format 子目录 → 递归复制 runs 输出 → 校验大小。
destination:
  path: "//nas/dd-clip-results"               # 目标 SMB/NAS 根路径
  username: ""                                # SMB 用户名；已映射网络驱动器可留空
  password: ""                                # SMB 密码；Windows 已保存凭据可留空
  folder_format: "{date}_{streamer}"          # 子目录名；{date}=YYMMDD {streamer}=从路径解析

# ─── processing：调用主程序时的参数 ──────────────────────────
# 【作用】连接 cut_copy 与 dd-clip-miner-llm 主配置。
# 【流程】对每个新录播执行: python -m dd_clip_miner_llm run <file> --config <config_path>
processing:
  config_path: "config.yaml"                  # 主配置路径（profile、content_types、ASR 等）
  skip_on_failure: true                       # true=单文件失败继续下一个 | false=中止整批

# ─── behavior：批处理完成后的清理与关机 ──────────────────────
# 【作用】控制复制验证、源文件删除、日志、批量上限与关机。
# 【流程】全部文件处理完 → 写 log → 若 shutdown_after 则等待 shutdown_delay 秒后关机。
# 建议: 首次部署先保持 shutdown/delete 为 false，链路稳定后再改为 true。
behavior:
  shutdown_after: false                       # true=全部完成后关机 GPU 机；调试阶段建议 false
  shutdown_delay: 60                          # 关机倒计时 (秒)，可用 shutdown /a 取消
  delete_source_after_copy: false             # true=校验通过后删除 source 侧原录播；确认归档无误后再开
  delete_work_dir: false                      # true=删除本地 runs/ 工作目录；调试阶段建议 false
  log_file: "cut_copy.log"                    # 日志文件名（写在当前工作目录）
  max_files: 0                                # 单次最多处理文件数；0=不限
  max_runtime: 0                              # 单次最长运行 (秒)；0=不限，超时则做完当前文件后停