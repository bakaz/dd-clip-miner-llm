# cut_copy.conf - 录播自动处理工作流配置
# 由 dd-clip-miner-llm cut-copy 命令读取
# 用法: python -m dd_clip_miner_llm cut-copy --conf cut_copy.conf

# ─── DDTV 录播源 ────────────────────────────────────────────
source:
  # DDTV 录播输出目录（GPU 机器通过 SMB 访问 DDTV 机器的路径）
  # 示例: "//ddtv-machine/Recordings" 或已映射的盘符 "R:/"
  path: "//ddtv-machine/Recordings"

  # 文件匹配模式（DDTV 输出为 _fix.mp4）
  pattern: "*_fix.mp4"

  # 忽略已处理文件的标记文件名
  done_marker: ".dd_clip_miner_cut_copy_done.json"

# ─── 处理目标（SMB 共享）────────────────────────────────────
destination:
  # SMB 共享路径（处理完成后复制到这里）
  # 示例: "//nas/dd-clip-results" 或已映射的盘符 "N:/"
  path: "//nas/dd-clip-results"

  # SMB 认证（可选，Windows 已映射或已保存凭据时可留空）
  username: ""
  password: ""

  # 目标子目录格式（支持 {date}, {streamer} 变量）
  folder_format: "{date}_{streamer}"

# ─── 处理参数 ──────────────────────────────────────────────
processing:
  # dd-clip-miner-llm 的主配置文件路径（profile、content_types 等在 config.yaml 中配置）
  config_path: "config.yaml"

  # 处理失败时跳过该文件继续下一个（true）还是中止（false）
  skip_on_failure: true

# ─── 行为控制 ──────────────────────────────────────────────
behavior:
  # 处理完成后关机
  shutdown_after: true

  # 关机前等待时间（秒），给用户取消的窗口
  shutdown_delay: 60

  # 验证复制成功后删除源文件
  delete_source_after_copy: true

  # 删除本地工作目录（runs/ 下的输出）
  delete_work_dir: true

  # 日志文件路径（相对于工作目录）
  log_file: "cut_copy.log"

  # 最大处理文件数（0 = 不限）
  max_files: 0

  # 单次运行最大时长（秒，超时则完成当前文件后停止，0 = 不限）
  max_runtime: 0
