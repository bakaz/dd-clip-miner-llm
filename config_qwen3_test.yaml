audio:
  sample_rate: 16000
  channels: 1

asr:
  mode: local
  local:
    backend: qwen3_asr
    funasr:
      model: Qwen/Qwen3-ASR-1.7B
      hub: hf
      device: cuda:0
      dtype: bf16
      batch_size: null
      language: null
      timestamp_chunk_seconds: 180
      max_workers: 1
      forced_aligner: Qwen/Qwen3-ForcedAligner-0.6B
      forced_aligner_kwargs: {}
      generate_kwargs:
        return_time_stamps: true
      lyrics:
        enabled: false
        max_line_chars: 24
        sentence_punctuation: "。！？.!?\n"
        max_sentence_duration_ms: 5000
      fallback:
        enabled: true
        chunk_seconds: 5
        max_segment_seconds: 15
        sparse_chars_per_sec: 1.0
        repeat_threshold: 3
        padding_seconds: 2.0
        max_workers: 1
        merge_policy: replace_ranges
        zero_duration_policy: merge_adjacent
    faster_whisper:
      device: auto
      compute_type: default
      cpu_threads: 8
      num_workers: 1
      language: null
      beam_size: 5
      initial_prompt: null
      word_timestamps: true
      split_on_word_gaps: true
      word_gap_seconds: 2.0
      max_segment_seconds: 15.0
      batch:
        model: turbo
        inference_mode: batched
        batch_size: 8
        vad_filter: true
      standard:
        model: turbo
        inference_mode: standard
        batch_size: 0
        vad_filter: false
      fallback:
        enabled: true
        primary_mode: batch
        fallback_mode: standard
        min_gap_seconds: 4.0
        padding_seconds: 2.0
        max_workers: 1
        merge_policy: fill_gaps

llm:
  provider_route:
  - opencode
  providers:
    opencode:
      api_key: null
      api_key_env: OPENCODE_API_KEY
      base_url: https://opencode.ai/zen/go/v1
      model: deepseek-v4-flash
      temperature: 0.1
      max_tokens: 8192
      timeout_schedule: [60, 120, 180]
      retry_backoff_seconds: [2, 5]
      retry_jitter_ratio: 0.25
      result_retries: 2

default_profile: kv_optimized
profiles:
  kv_optimized:
    llm:
      cache_friendly_prompt_layout: true
      compact_segment_ranges: true
    song:
      normalization:
        force_merge_same_title: true
        chorus_aware_split: true
        chorus_gap_seconds: 130.0
        chorus_similarity_threshold: 0.3
        chorus_context_segments: 3
      pipeline:
        strategy: risk_routed_kv
        runtime_adaptive: fixed_three_stage
        temporal_adjudication:
          enabled: true
          preserve_source_names: true
          max_completion_tokens: 8192
        stages:
          discovery: precision
          recall_audit: uncovered_evidence
          adjudication: full_transcript
        continuation_overlap_segments: 50
        allow_final_discovery: true
        anchor_boundary_expansion: false
      naming:
        search_query_source: lyric_anchors
        preserve_unknown_on_weak_evidence: true
      search:
        enabled: false
        search_unknown_only: true
        max_searches: 25
      missed_recheck:
        enabled: true
        output_mode: anchors
        min_uncovered_seconds: 10.0
        check_all_uncovered: true
        max_tool_rounds: 0
      review:
        enabled: false

content_types:
  song: true
  dialogue: false
  highlight: false
  funny: false
  cringe: false
  daily_summary: false

output:
  video_clips: false
  audio_segments: true
  audio_extension: mp3
  audio_bitrate_kbps: 320
