# =============================================================================
# Qwen3-ASR 管线测试配置
# =============================================================================
# 用法: python -m dd_clip_miner_llm run live.mp4 --config config_qwen3_test.yaml
#
# 【用途】验证 GPU Qwen3 + kv_optimized 歌曲管线，轻量输出（仅音频、无视频）。
# 【流程】ASR(Qwen3) → song(kv_optimized) → 导出 mp3，跳过 daily_summary 与其他类型。
# =============================================================================

# ─── audio ───────────────────────────────────────────────────
audio:
  sample_rate: 16000   # ASR 输入采样率 (Hz)
  channels: 1          # 单声道

# ─── asr：Qwen3 测试 ────────────────────────────────────────
asr:
  mode: local
  local:
    backend: qwen3_asr # 测试目标：Qwen3-ASR GPU 路径

    funasr:
      device: auto                    # auto | cuda:0 | cpu
      trust_remote_code: true
      batch_size: null                # null=自动
      language: null                  # null=自动检测
      generate_kwargs:
        return_time_stamps: true      # 词级时间戳
      lyrics:
        enabled: false
        max_line_chars: 24
        sentence_punctuation: "。！？.!?\n"
        max_sentence_duration_ms: 5000
      fallback:
        enabled: true                 # 稀疏段分块重跑
        chunk_seconds: 5
        max_segment_seconds: 15
        sparse_chars_per_sec: 1.0
        repeat_threshold: 3
        padding_seconds: 2.0
        max_workers: 1
        min_gap_seconds: 10.0
        merge_policy: fill_fix_asr
        zero_duration_policy: merge_adjacent

    faster_whisper:
      device: auto
      compute_type: default
      batch:
        model: small
        inference_mode: batched
        batch_size: 8
        vad_filter: true
      standard:
        model: small
        inference_mode: standard
        batch_size: 0
        vad_filter: false
      fallback:
        enabled: true                 # batch→standard 回退
        primary_mode: batch
        fallback_mode: standard
        min_gap_seconds: 10.0
        merge_policy: fill_fix_asr

    gpu:
      funasr:
        model: Qwen/Qwen3-ASR-1.7B  # 测试主模型
        hub: ms                       # ModelScope 源（与生产 config.example 一致）
        device: cuda:0
        dtype: bf16
        timestamp_chunk_seconds: 180
        max_workers: 1                # 测试默认单 worker，减少显存占用
        forced_aligner: Qwen/Qwen3-ForcedAligner-0.6B
        forced_aligner_kwargs: {}
      faster_whisper:
        batch:
          model: turbo
        standard:
          model: turbo

    cpu:
      backend: faster_whisper
      faster_whisper:
        compute_type: int8
        batch:
          model: small
        standard:
          model: small

# ─── llm ─────────────────────────────────────────────────────
llm:
  provider_route:
  - opencode
  providers:
    opencode:
      api_key: null
      api_key_env: OPENCODE_API_KEY
      base_url: https://opencode.ai/zen/go/v1
      model: deepseek-v4-flash
      temperature: 0.1
      max_tokens: 8192
      timeout_schedule: [60, 120, 180]
      retry_backoff_seconds: [2, 5]
      retry_jitter_ratio: 0.25
      result_retries: 2

default_profile: kv_optimized           # 使用三阶段 KV 歌曲管线
profiles:
  kv_optimized:
    llm:
      cache_friendly_prompt_layout: true   # KV 缓存友好 prompt
      compact_segment_ranges: true         # 压缩段范围省 token
    song:
      normalization:
        force_merge_same_title: true       # 同歌名合并
        chorus_aware_split: true           # 副歌感知切分多次演唱
        chorus_gap_seconds: 130.0
        chorus_similarity_threshold: 0.3
        chorus_context_segments: 3
      pipeline:
        strategy: risk_routed_kv           # 发现→召回→裁决
        runtime_adaptive: fixed_three_stage
        temporal_adjudication:
          enabled: true
          preserve_source_names: true
          max_completion_tokens: 8192
        stages:
          discovery: precision
          recall_audit: uncovered_evidence
          adjudication: full_transcript
        continuation_overlap_segments: 50
        allow_final_discovery: true
        anchor_boundary_expansion: false
      naming:
        search_query_source: lyric_anchors
        preserve_unknown_on_weak_evidence: true
      search:
        enabled: false
        search_unknown_only: true
        max_searches: 25
      missed_recheck:
        enabled: true
        output_mode: anchors               # 测试用 anchors 模式
        min_uncovered_seconds: 10.0
        check_all_uncovered: true
        max_tool_rounds: 0
      review:
        enabled: false                     # 三阶段已含裁决

content_types:
  song: true                            # 仅测歌曲
  dialogue: false
  highlight: false
  funny: false
  cringe: false
  daily_summary: false

output:
  video_clips: false                    # 测试跳过视频导出
  audio_segments: true                  # 保留 mp3 验证切点
  audio_extension: mp3
  audio_bitrate_kbps: 320